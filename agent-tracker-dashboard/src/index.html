<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-green {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-online {
            animation: pulse-green 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
    <div class="container mx-auto p-6">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">Agent Tracker</h1>
                <p class="text-slate-400">Real-time AI Agent Activity Monitor</p>
            </div>
            <div class="flex items-center space-x-4">
                <div id="connection-status" class="flex items-center text-sm text-red-400">
                    <span class="w-3 h-3 rounded-full bg-red-500 mr-2"></span>
                    Disconnected
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Statistics Cards -->
            <div class="lg:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                    <p class="text-slate-400 text-sm">Total Events</p>
                    <p id="stat-total-events" class="text-2xl font-bold">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                    <p class="text-slate-400 text-sm">File Changes</p>
                    <p id="stat-file-changes" class="text-2xl font-bold text-blue-400">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                    <p class="text-slate-400 text-sm">Editor Edits</p>
                    <p id="stat-editor-edits" class="text-2xl font-bold text-purple-400">0</p>
                </div>
            </div>

            <!-- Live Feed -->
            <div class="lg:col-span-2 bg-slate-800 rounded-lg border border-slate-700 overflow-hidden flex flex-col h-[600px]">
                <div class="p-4 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center">
                    <h2 class="text-lg font-semibold">Live Activity Feed</h2>
                    <button id="clear-feed" class="text-xs text-slate-400 hover:text-white transition-colors">Clear Feed</button>
                </div>
                <div id="event-feed" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <!-- Events will be injected here -->
                    <div class="text-slate-500 text-center mt-10">Waiting for events...</div>
                </div>
            </div>

            <!-- Detailed View / Inspector -->
            <div class="bg-slate-800 rounded-lg border border-slate-700 flex flex-col h-[600px]">
                <div class="p-4 border-b border-slate-700 bg-slate-800/50">
                    <h2 class="text-lg font-semibold">Event Inspector</h2>
                </div>
                <div id="inspector" class="p-4 overflow-y-auto text-sm font-mono text-slate-300">
                    <p class="text-slate-500 italic">Select an event to inspect details</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
